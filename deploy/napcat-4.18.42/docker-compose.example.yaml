name: napcat

services:
  napcat:
    image: ghcr.io/mingk326/napcatqq:4.18.42
    container_name: NapCat
    restart: always
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1001
      - MODE=astrbot
      - TZ=Asia/Shanghai
    ports:
      - "6200:6099"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./ntqq:/app/.config/QQ
    networks:
      - napcat_network

networks:
  napcat_network:
    driver: bridge

